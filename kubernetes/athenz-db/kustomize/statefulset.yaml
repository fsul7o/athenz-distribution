---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: athenz-db
  labels:
    app.kubernetes.io/name: athenz-db
    app.kubernetes.io/instance: athenz-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: athenz-db
      app.kubernetes.io/instance: athenz-db
  serviceName: athenz-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: athenz-db
        app.kubernetes.io/instance: athenz-db
    spec:
      restartPolicy: Always
      volumes:
        - name: databases
          emptyDir: {}
        # Drop-in MariaDB config to load the server_audit plugin at boot.
        # Used by kubernetes/loadtest/contention to count 1062 (Duplicate
        # entry) events from the audit log; harmless otherwise (logs to
        # /tmp on the container). See audit-configmap.yaml.
        - name: audit-conf
          configMap:
            name: athenz-db-audit-conf
      containers:
        - name: athenz-db
          image: ghcr.io/ctyano/athenz-db:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: MYSQL_ROOT_PASSWORD
              value: ""
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 3306
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 256Mi
              cpu: 250m
          volumeMounts:
            - name: databases
              mountPath: /config/databases/
            # linuxserver/mariadb (the base image) reads /config/custom.cnf at
            # startup. Mount our server_audit drop-in there. Path matters —
            # the MariaDB default /etc/mysql/conf.d is not honored by this
            # image's entrypoint.
            - name: audit-conf
              mountPath: /config/custom.cnf
              subPath: zz-audit.cnf
              readOnly: true
